<body bgcolor=black style=margin:0><canvas id=c width=320 height=180
        style=width:100%;max-width:177vh;display:block;margin:auto></canvas>
    <script>
        x = c.getContext('2d')
        W = 320
        H = 180
        M = Math
        S = M.sin
        C = M.cos
        R = M.random
        f = (a, b) => 30 * S(a / 19 + S(b / 23) * 2) + 25 * S(b / 13 + a / 31) + 8 * S(a / 5 + b / 7)
        px = py = an = t = o = ac = pt = tu = st = md = mx = my = de = sc = au = 0
        alt = 40
        sp = 1.6
        tm = 30
        K = Array(99).fill(0)
        rg = []

        function r() {
            st = 1
            pt = tu = sc = 0
            sp = 1.6
            tm = 30
            rg = []
            alt = f(px, py) + 45
        }
        function die() {
            st = 2;
            de = t;
            G.gain.value = 0;
            T(130, 25, .9, 'sawtooth')
        }
        go = _ => (!st || st > 1 && t > de + 90) && r();

        A = _ => {
            if (au) return;
            au = new AudioContext;
            b = au.createBuffer(1, 44100, 44100);
            d = b.getChannelData(0);
            for (i = 44100; i--;)d[i] = R() * 2 - 1; n = au.createBufferSource();
            n.buffer = b;
            n.loop = 1; F = au.createBiquadFilter();
            G = au.createGain();
            n.connect(F).connect(G).connect(au.destination);
            n.start()
        };
        T = (a, b, d, y, o = au.createOscillator(), g = au.createGain(), u = au.currentTime + d) => { o.type = y; o.frequency.value = a; o.frequency.exponentialRampToValueAtTime(b, u); g.gain.value = .2; g.gain.exponentialRampToValueAtTime(.001, u); o.connect(g).connect(au.destination); o.start(); o.stop(u) };
        onkeydown = e => {
            K[e.keyCode] = 1;
            go();
            A()
        };
        onkeyup = e => K[e.keyCode] = 0;
        onpointermove = onpointerup = e => {
            mx = e.clientX / innerWidth * 2 - 1;
            my = 1 - e.clientY / innerHeight * 2;
            md = e.buttons
        };
        onpointerdown = e => {
            onpointermove(e);
            go();
            A()
        };
        w = (s, y, z, l = 160) => {
            x.font = 'bold ' + z + 'px Arial';
            x.textAlign = 'center';
            x.fillStyle = 'white';
            x.fillText(s, l, y)
        };
        function U() {
            t++;
            if (!st) an = S(t / 90) * .6, px += S(an) * 1.5, py += C(an) * 1.5, alt = f(px, py) + 35;
            if (st == 1) {
                tu += (K[39] - K[37] + md * mx - tu) * .06;
                pt += (K[38] - K[40] + md * my - pt) * .06;
                an += tu * .03;
                sp = M.min(3, M.max(.7, sp - pt * .03 + (1.6 - sp) * .01));
                px += S(an) * sp; py += C(an) * sp;
                alt += pt * sp * .7 - .15 - (sp < 1) * (1 - sp) * 1.5;
                F.frequency.value = 250 + sp * 300; G.gain.value = .04 + sp * .07;
                tm -= 1 / 60; tm < 0 && die();
                while (rg.length < 4) q = an + (R() - .5) * 1.2, d = 150 + R() * 120, X = px + S(q) * d, Y = py + C(q) * d, rg.push([X, Y, M.max(f(X, Y) + 20, alt + R() * 60 - 30)]);
                rg = rg.filter(q => {
                    rx = q[0] - px; ry = q[1] - py; z = q[3] = rx * S(an) + ry * C(an); l = q[4] = rx * C(an) - ry * S(an);
                    if (l * l + (q[2] - alt) ** 2 + z * z < 150) return sc += 10, tm += 5, alt += 6, sp += .8, T(1200, 1800, .5, 'sine'), 0;
                    return z > -15
                });
                alt < f(px, py) + 2 && die()
            }
        }

        function D() {
            hz = 70 + pt * 35;
            g = x.createLinearGradient(0, 0, 0, hz); g.addColorStop(0, '#34548a'); g.addColorStop(1, 'tan'); x.fillStyle = g; x.fillRect(0, 0, W, H);
            sx = (M.atan2(S(.4 - an), C(.4 - an)) / 1.1 + .5) * W; sy = hz - 26;
            x.fillStyle = 'ivory'; x.beginPath(); x.arc(sx, sy, 11, 0, 7); x.fill();
            for (i = 0; i < W; i++) {
                a = an + (i / W - .5) * 1.1; dx = S(a); dy = C(a); ym = H;
                for (z = 1; z < 260; z += 1 + z / 70) {
                    X = px + dx * z; Y = py + dy * z; h = f(X, Y); s = (alt - h) / z * 110 + hz | 0;
                    if (s < ym) {
                        k = 1 - z / 260; l = (.7 + (h - f(X + 3, Y + 3)) / 25) * k; m = 1 - k;
                        x.fillStyle = `rgb(${210 * l + 210 * m},${150 * l + 180 * m},${90 * l + 140 * m})`;
                        x.fillRect(i, s, 1, ym - s); ym = s
                    }
                }
            }
            rg.map(q => {
                z = q[3]; u = (M.atan2(q[4], z) / 1.1 + .5) * W; v = (alt - q[2]) / z * 110 + hz;
                z > 2 && (x.strokeStyle = 'gold', x.lineWidth = 300 / z + 1, x.beginPath(), x.arc(u, v, 1210 / z, 0, 7), x.stroke())
            });
            x.strokeStyle = 'black'; x.lineWidth = 4; x.beginPath(); x.moveTo(W / 2 - 30, H - 12 + tu * 9); x.lineTo(W / 2 + 30, H - 12 - tu * 9); x.stroke();
            st == 1 ? w(sc + '  ' + (tm | 0) + 's', 14, 12) :
                (w(st ? 'Finish ' + sc : 'DUNAS', 70, 32), w('Arrow/Mouse - Click', 100, 9))
        }

        function L(n) {
            ac += M.min((n - o) / 16.7, 4); o = n;
            for (; ac >= 1; ac--)U();
            D(); requestAnimationFrame(L)
        }
        requestAnimationFrame(L)
    </script>
