<body style="margin:0;background:#1a1410;touch-action: none;"></body>
<canvas id=c width=320 height=180 style="width:100%;max-width:177vh;display:block;margin:auto;"></canvas>
<script>
    x = c.getContext('2d')
    W = 320
    H = 180
    M = Math
    S = M.sin
    C = M.cos
    R = M.random;

    f = (a, b) => 30*S(a/19+S(b/23)*2)+25*S(b/13+a/31)+8*S(a/5+b/7);
    px=py=an=t=o=ac=pt=tu=0;
    alt=40
    sp=1.6
    st=md=mx=my=de=0
    K={}

    function r(){
        st=1
        pt=tu = 0
        sp=1.6
        alt=f(px,py)+45
    }
    function die(){
        st=2
        de=t
    }
    go=()=>{if(st==0||st==2&&t>de+50)r()}
    onkeydown=e=>{K[e.code]=1; if(e.code=='Space')go()}
    onpointermove=pm;onpointerup=()=>md=0;

    w = (s,y,z,l,v=l||W/2)=>{x.font='bold'+z+'px Arial';x.textAlign=l?'left':'center';x.fillStyle='#2a1408';x.fillText(s,v+1,y+1);x.fillStyle='#fff3d0';x.fillText(s,v,y)}

    function U(){
        t++
        an=S(t/90)*.6;px+=S(an)*1.5;py+=C(an)*1.5;alt=f(px,py)+35
    }
    function D(){
        hz=70+pt*35
        g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#34548a');g.addColorStop(1,'rgb(240,195,150)');x.fillStyle=g;x.fillRect(0,0,W,H)

        sx=(M.atan2(S(.4-an),C(.4-an))/1.1+.5)*W
        sy=hz-26;x.fillStyle='rgba(255,226,160,.25)';x.beginPath();x.arc(sx, sy, 24, 0, 7);x.fill();x.fillStyle = '#fff3d0';x.beginPath();x.arc(sx, sy, 11, 0, 7);x.fill();
        for(i=0;i<W;i++){
            a=an+(i/W-.5)*1.1;dx = S(a);dy = C(a);ym = H
            for(z=1;z<260;z+=1+z/70){
                X=px+dx*z
                Y=py+dy*z
                h=f(X, Y)
                s=(alt - h)/z*110+hz|0
                if(s<ym){
                    k=1-z/260
                    l=.7+(h-f(X+3,Y+3))/ 25
                    x.fillStyle=`rgba(${210*l*k+240*(1-k)},${150*l*k+195*(1-k)},${90*l*k+150*(1-k)})`
                    x.fillRect(i,s,1,ym-s)
                    ym=s
                }
            }
        }
    }


    function L(n){
        ac += M.min((n - o) / 16.7,4);o = n
        for(;ac >= 1; ac --) U();D()
        requestAnimationFrame(L)
    }
    requestAnimationFrame(L)
</script>
